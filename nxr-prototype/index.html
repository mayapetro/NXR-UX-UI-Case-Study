let tt;function tick(){clearInterval(tt);tt=setInterval(()=>{const e=$('#tm');if(!e||S.cur!=='start')return clearInterval(tt);const s=Math.floor((Date.now()-S.t0)/1e3);e.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},1000)}
const closeAll=()=>{$('#sh').classList.remove('on');$('#dw').classList.remove('on');$('#scr').classList.remove('on')};
function sheet(t,o,cb){$('#sh').innerHTML=`<h4>${t}</h4>`+o.map(([v,l,d])=>`<button class="o" data-ov="${v}" ${d?'disabled':''}>${l}<em>${d||''}</em></button>`).join('');$('#sh').onclick=e=>{const b=e.target.closest('[data-ov]');if(b&&!b.disabled){cb(b.dataset.ov);closeAll()}};$('#sh').classList.add('on');$('#scr').classList.add('on')}
const ACT={share:()=>toast('Link copied'),ph:()=>{S.photo=1-S.photo;draw()},apply:()=>{S.cart=1;toast('Added to your bookings');go('booking')},del:()=>{S.cart=0;toast('Booking removed');go('explore')},
 checkout:()=>S.ag?go('pay'):toast('Please agree to the rental agreement'),
 pay:()=>{const p=S.pay,bad=[];if(p.n.replace(/\s/g,'').length!==16)bad.push('p-n');if(p.nm.trim().length<2)bad.push('p-nm');if(!/^(0[1-9]|1[0-2])\/\d\d$/.test(p.ex))bad.push('p-ex');if(!/^\d{3,4}$/.test(p.cv))bad.push('p-cv');bad.forEach(i=>$('#'+i).classList.add('bad'));if(bad.length)return toast('Check the highlighted fields');S.pts=Math.round(calc().tot*3);go('success')},
 dir:()=>go('location',1),start:()=>{S.t0=Date.now();draw()},sclr:()=>{S.sq='';draw();$('#sq').focus()},sgo:()=>go('explore')};
document.addEventListener('click',e=>{const t=e.target.closest('button,.card,[data-menu]');if(!t)return;const D=t.dataset;
 if(D.fav){e.stopPropagation();S.fav.has(D.fav)?S.fav.delete(D.fav):S.fav.add(D.fav);draw();return}
 if(t.classList.contains('card')){S.veh=D.v;S.photo=0;S.hist.push(S.cur);S.cur='detail';draw();return}
 if(D.go)return go(D.go);if('b' in D)return go('back');if('menu' in D){$('#dw').innerHTML=`<img src="${LG}" alt="NXR">`+[['explore','Home'],['booking','Rentals Details'],['start','Start / Return Vehicle'],['location','Contact'],['login','Profile']].map(([g,l])=>`<button data-go="${g}">${l}</button>`).join('')+`<button data-t="Signed out (demo)">Sign out</button><div class="f">${[['support','Help'],['rewards','Points'],['tutorials','Tutorials'],['protips','Guidelines']].map(([g,l])=>`<button data-go="${g}">${l}</button>`).join('')}<button data-t="About NXR">About</button><button data-t="Careers">Careers</button></div>`;$('#dw').classList.add('on');$('#scr').classList.add('on');return}
 if(D.tab)return go(D.tab);if(D.t)return toast(D.t);if(D.act)return ACT[D.act]&&ACT[D.act]();
 if(D.sheet){const m={trip:['Trip Types',[['','All trips'],['2 riders','2 riders'],['family','Family'],['half day','Half day']],v=>{S.tag=v;draw()}],price:['Price',[['999','Any price'],['200','Under $200'],['100','Under $100']],v=>{S.price=+v;draw()}],more:['More filters',[['','Clear all filters'],['2 riders','Only 2 riders'],['family','Only family']],v=>{S.tag=v;S.price=999;draw()}]}[D.sheet];return sheet(...m)}
 if(D.day){const d=new Date(+D.day);if(S.pick){if(d>=S.d1){S.d2=d}else{S.d1=d;S.d2=d}S.pick=0}else{S.d1=S.d2=d;S.pick=1}draw();return}
 if(D.mo){S.m=new Date(S.m.getFullYear(),S.m.getMonth()+ +D.mo,1);draw();return}
 if(D.st){const[k,n]=D.st.split(','),L={ad:[1,8],kd:[0,6],vn:[1,4]}[k];S[k]=Math.min(L[1],Math.max(L[0],S[k]+ +n));if(S.vn>S.ad){S.vn=S.ad;toast('One driver per vehicle')}['ad','kd','vn'].forEach(x=>$('#o-'+x).textContent=S[x]);return}
 if('em' in D){if(D.em==='1')toast('Confirmation sent to melisa.jones@gmail.com');setTimeout(()=>go('rewards'),D.em==='1'?1000:200);return}
 if('rw' in D){if(D.rw==='0')return go('location');sheet('Choose rewards',[[800,'$20 off your next ride',S.pts>=800?'Redeem':'800 pts'],[1200,'Free helmet upgrade',S.pts>=1200?'Redeem':'1200 pts'],[1800,'Free half day',S.pts>=1800?'Redeem':'1800 pts']].map(([v,l,d])=>[v,l,S.pts>=v?'':d]),v=>{toast('Reward added to your account');setTimeout(()=>go('location'),900)});return}
 if(D.pm){S.pm=D.pm;draw();return}if('z' in D){t.classList.toggle('open');t.nextElementSibling.classList.toggle('open');return}
 if(D.star){S.rate=+D.star;draw();return}
 if('sg' in D){S.sq=D.sg||S.sq;const v=D.sg.toLowerCase();S.tag=v.includes('2 riders')?'2 riders':v.includes('family')?'family':v.includes('half day')?'half day':'';go('explore');return}
 if('k' in D){let v=$('#sq').value;if(D.k==='⌫')v=v.slice(0,-1);else if(D.k!=='⇧')v+=D.k;$('#sq').value=v;S.sq=v;upSg();return}});
$('#ls').innerHTML=SCREENS.map(([n,id,l,st])=>`<button data-lk="${id}${st||(id==='location'?0:'')}" data-n="${id}" data-s="${st||0}"><b>${n}</b>${l}</button>`).join('');
$('#ls').onclick=e=>{const b=e.target.closest('button');if(b){S.hist=[];if(b.dataset.n==='booking'&&!S.cart)S.cart=1;S.tag=b.dataset.n==='explore'?'':S.tag;go(b.dataset.n,+b.dataset.s,0)}};
function fit(){const st=innerWidth<=860,s=Math.min(1.25,(innerHeight-(st?32:40))/772,(st?innerWidth-40:Math.min(innerWidth,1180)-380)/360);$('#ph').style.transform=`scale(${s})`;$('#pw').style.width=360*s+'px';$('#pw').style.height=772*s+'px'}fit();addEventListener('resize',fit);
go('explore',0,0);
</script></body></html>
